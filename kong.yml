_format_version: "3.0"
services:
  - name: aether-ms-auth
    url: http://aether-ms-auth.aether.svc.cluster.local:8080
    routes:
      - name: aether-ms-auth-route
        paths:
          - /api/auth
          - /api/profile
        strip_path: false
  - name: aether-ms-calculator
    url: http://aether-ms-calculator.aether.svc.cluster.local:8080
    routes:
      - name: aether-ms-calculator-route
        paths:
          - /api/calculator
        strip_path: false
  - name: aether-ms-inventory
    url: http://aether-ms-inventory.aether.svc.cluster.local:8080
    routes:
      - name: aether-ms-inventory-route
        paths:
          - /api/inventories
        strip_path: false
  - name: aether-ms-cloudinary
    url: http://aether-ms-cloudinary.aether.svc.cluster.local:8080
    routes:
      - name: aether-ms-cloudinary-route
        paths:
          - /api/cloudinary
        strip_path: false
  - name: ms-aeko-hub
    url: http://ms-aeko-hub.aether.svc.cluster.local:8000
    connect_timeout: 2147483646
    write_timeout: 2147483646
    read_timeout: 2147483646
    routes:
      - name: ms-aeko-hub-route
        paths:
          - /hub
        strip_path: true
        preserve_host: true
      - name: ms-aeko-hub-mcp
        paths:
          - "~/hub/ai/mcp$"
        strip_path: false
        preserve_host: true
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /ai/mcp/
  - name: aether-web-administrative
    url: http://aether-web-administrative.aether.svc.cluster.local:8080
    routes:
      - name: aether-web-administrative-route
        paths:
          - /
        strip_path: true
  - name: aether-web-flow
    url: http://aether-web-flow.aether.svc.cluster.local:80
    routes:
      - name: aether-web-flow-route
        paths:
          - /dashboard
        strip_path: true
